plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

def mixinConfig = 'weatherchanger.mixins.json'
def mixinRefMap = layout.buildDirectory.file('tmp/mixin/compileJava/weatherchanger.refmap.json').get().asFile
def forgeDependency = minecraft.dependency("net.minecraftforge:forge:${rootProject.property('forge.version')}")

base {
    archivesName = "${rootProject.property('archives_base_name')}-forge"
}

sourceSets {
    main {
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run').asFile
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args '--mixin.config', mixinConfig
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()

    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    implementation forgeDependency

    implementation 'com.google.code.gson:gson:2.10.1'
    annotationProcessor "org.spongepowered:mixin:${rootProject.property('mixin_version')}:processor"
}

tasks.named('compileJava', JavaCompile).configure {
    doFirst {
        mixinRefMap.parentFile.mkdirs()
        mixinRefMap.delete()

        options.compilerArgs.addAll([
            "-AoutRefMapFile=${mixinRefMap.canonicalPath}",
            '-ApluginVersion=0.7'
        ])
    }
}

processResources {
    def sharedIcon = file('../assets/logo.png')
    def properties = [
        version          : project.version,
        mod_id           : rootProject.property('mod_id'),
        minecraft_version: rootProject.property('minecraft_version'),
        loader_version   : rootProject.property('forge.version').toString().tokenize('-').last().tokenize('.').first(),
        forge_version    : rootProject.property('forge.version').toString().tokenize('-').last(),
        shared_icon      : sharedIcon.path
    ]

    inputs.properties(properties)

    from(sharedIcon) {
        into ''
        rename { 'icon.png' }
    }

    filesMatching('META-INF/mods.toml') {
        expand(properties)
    }
}

jar {
    from('../LICENSE.md')
    from(mixinRefMap)

    manifest {
        attributes(
            'Implementation-Version': project.version,
            'MixinConfigs': mixinConfig
        )
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.property('java_version').toString().toInteger())
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
}